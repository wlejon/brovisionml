name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# brovisionml composes brotensor ops and uses broimage for host-side image
# decode / resampling / normalize. Its dependency closure is bromath
# (header-only) + brotensor (Tensor + CPU op backend) + broimage. CI builds the
# default CPU-only configuration (GPU backends OFF), so the DSINE CUDA kernels
# brovisionml ships are not compiled. Every job builds a plain clone, checked
# out under brovisionml/ with the build tree beside it; the three siblings and
# bronze (the JavaScript runtime brovisionml_api binds, with brass, its code
# generator) come from the heads of their main branches (cmake/bro_deps.cmake),
# fetched at configure. There are no submodules and no sibling checkouts.
#
# bronze and brass compile inside this build tree with the
# job's own compiler and CRT — the api is bound across bronze's C++ embed
# boundary, so a prebuilt bronze would be an unverifiable ABI hazard. That is
# what makes brovisionml_test_api the check that the library works the way
# bro uses it.
#
# Ninja on Linux/macOS bounds parallelism once brotensor's op TUs are in the
# build; Windows keeps the VS generator (MSBuild /m is bounded).
jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc,    os: ubuntu-24.04, cc: gcc,   cxx: g++ }
          - { name: linux-clang,  os: ubuntu-24.04, cc: clang, cxx: clang++ }
          - { name: windows-msvc, os: windows-2022 }
          - { name: macos-arm64,  os: macos-15 }
    steps:
      - uses: actions/checkout@v7
        with:
          path: brovisionml

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ninja-build
      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S brovisionml -B build -DCMAKE_BUILD_TYPE=Release
          else
            cmake -S brovisionml -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          fi
        shell: bash

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  # ── Coverage ──────────────────────────────────────────────────────────────
  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: brovisionml

      - name: Install gcovr + Ninja
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends gcovr ninja-build

      - name: Configure (instrumented)
        run: |
          cmake -S brovisionml -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="--coverage" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Report
        shell: bash
        run: |
          set -o pipefail
          mkdir -p coverage-html
          gcovr --root . \
            --filter 'brovisionml/include/brovisionml/' --filter 'brovisionml/src/' \
            --exclude-unreachable-branches \
            --gcov-ignore-errors=no_working_dir_found \
            --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
            --print-summary \
            --html-details coverage-html/index.html \
            | tee coverage-summary.txt
          test -s coverage-html/index.html

      - name: Job summary
        if: always()
        run: |
          {
            echo '## Coverage — `include/brovisionml/` + `src/`'
            echo
            echo 'The bromath / brotensor / broimage dependencies are filtered out.'
            echo
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: coverage-html/
          retention-days: 14
